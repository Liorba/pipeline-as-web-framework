name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: python3 -m pytest -v

      - name: Verify DAG imports
        run: PYTHONPATH=src:dags python3 -c "from pipeline_as_web_dag import pipeline_as_web_dag; print('DAG OK:', pipeline_as_web_dag.dag_id)"
